<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f6cf6"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%">
      <stop offset="0" stop-color="#6f6cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6f6cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
  </defs>
  <style>
    .drift { animation: drift 14s ease-in-out infinite alternate; }
    .drift2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
    .spin { animation: spin 44s linear infinite; transform-origin: 600.0px 315.0px; }
    .spin-slow { animation: spin 72s linear infinite reverse; transform-origin: 600.0px 315.0px; }
    .pulse { animation: pulse 3.6s ease-in-out infinite; }
    @keyframes drift { from { transform: translate(-26px,-16px); } to { transform: translate(26px,18px); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) {
      .drift, .drift2, .spin, .spin-slow, .pulse { animation: none; }
    }
  </style>
  <rect width="1200" height="630" fill="#070b16"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridmask)"/>
  <ellipse class="drift" cx="420" cy="225" rx="330" ry="250" fill="url(#glow1)"/>
  <ellipse class="drift2" cx="820" cy="425" rx="300" ry="230" fill="url(#glow2)"/>
  <g class="spin"><ellipse cx="600.0" cy="315.0" rx="156" ry="91" fill="none" stroke="#8ea2ff" stroke-opacity=".3" stroke-width="1.6" transform="rotate(-24 600.0 315.0)"/>
  <circle class="pulse" cx="690" cy="366" r="6.9" fill="#38bdf8" style="animation-delay:2.6s"/>
  <circle class="pulse" cx="635" cy="211" r="4.5" fill="#38bdf8" style="animation-delay:1.3s"/>
  <circle class="pulse" cx="584" cy="223" r="6.9" fill="#38bdf8" style="animation-delay:1.8s"/>
  </g>
  <g class="spin-slow"><ellipse cx="600.0" cy="315.0" rx="229" ry="153" fill="none" stroke="#8ea2ff" stroke-opacity=".3" stroke-width="1.6" transform="rotate(-27 600.0 315.0)"/>
  <circle class="pulse" cx="813" cy="285" r="5.2" fill="#38bdf8" style="animation-delay:1.6s"/>
  <circle class="pulse" cx="474" cy="216" r="5.3" fill="#38bdf8" style="animation-delay:1.5s"/>
  <circle class="pulse" cx="492" cy="483" r="4.3" fill="#38bdf8" style="animation-delay:1.6s"/>
  <circle class="pulse" cx="812" cy="292" r="4.4" fill="#38bdf8" style="animation-delay:0.1s"/>
  </g>
  <g class="spin"><ellipse cx="600.0" cy="315.0" rx="329" ry="187" fill="none" stroke="#8ea2ff" stroke-opacity=".3" stroke-width="1.6" transform="rotate(-16 600.0 315.0)"/>
  <circle class="pulse" cx="899" cy="191" r="5.6" fill="#38bdf8" style="animation-delay:0.7s"/>
  <circle class="pulse" cx="302" cy="300" r="5.8" fill="#38bdf8" style="animation-delay:1.8s"/>
  <circle class="pulse" cx="282" cy="348" r="4.0" fill="#38bdf8" style="animation-delay:0.4s"/>
  <circle class="pulse" cx="852" cy="387" r="4.2" fill="#38bdf8" style="animation-delay:2.1s"/>
  <circle class="pulse" cx="859" cy="380" r="4.9" fill="#38bdf8" style="animation-delay:0.1s"/>
  </g>
  <circle cx="600.0" cy="315.0" r="46" fill="url(#g1)" opacity=".9"/><circle cx="600.0" cy="315.0" r="60" fill="none" stroke="#6f6cf6" stroke-opacity=".5" stroke-width="2"/>
  <rect x="56" y="526" width="152" height="46" rx="23"
        fill="#070b16" fill-opacity=".55" stroke="#8ea2ff" stroke-opacity=".45"/>
  <text x="70" y="557" fill="#8ea2ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="19" letter-spacing="1.2">Agentic AI</text>
  <text x="1144" y="557" fill="#7f8db5" text-anchor="end"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">sandeepbazar</text>
  <title>Agentic AI — cover art</title>
</svg>
