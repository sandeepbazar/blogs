<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" role="img" aria-label="Above, a closed loop in which the same model writes a change, reviews its own diff, agrees with itself and commits, with nothing outside the loop. Below, the same loop with a gate between the attempt to write and the commit, which denies the write while a BLOCK verdict stands.">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .cap{font-size:16px;font-weight:700;letter-spacing:.16em;fill:#5a6b8c}
    .h{font-size:26px;font-weight:800;fill:#e8ecf8}
    .n{font-size:19px;fill:#e8ecf8}
    .s{font-size:17px;fill:#93a4c8}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes flow{to{stroke-dashoffset:-40}}
    @keyframes stopped{0%,42%{opacity:0;transform:scale(.85)}52%{opacity:1;transform:scale(1.08)}62%,100%{opacity:1;transform:scale(1)}}
    @keyframes held{0%,36%{opacity:.28}48%,100%{opacity:1}}
    .o{animation:orbit 7s linear infinite;transform-origin:410px 250px}
    .f{stroke-dasharray:7 11;animation:flow 1.7s linear infinite}
    .st{animation:stopped 7s ease-out infinite;transform-origin:410px 640px}
    .hd{animation:held 7s ease-out infinite}
    @media (prefers-reduced-motion:reduce){
      .o,.f,.st,.hd{animation:none}
      .st,.hd{opacity:1;transform:none}
    }
  </style>
  <rect width="820" height="760" fill="#0b1020"/>

  <!-- panel 1 -->
  <text class="sans cap" x="40" y="42">TODAY</text>
  <text class="sans h" x="40" y="78">The same model, all the way round</text>

  <circle cx="410" cy="250" r="108" fill="none" stroke="#1e2a4a" stroke-width="2"/>
  <circle cx="410" cy="250" r="108" fill="none" stroke="#8ea2ff" stroke-width="2.5" class="f" opacity=".55"/>
  <g class="o"><circle cx="410" cy="142" r="8" fill="#8ea2ff"/></g>

  <rect x="298" y="122" width="224" height="40" rx="10" fill="#121a30" stroke="#1e2a4a"/>
  <text class="sans n" x="410" y="148" text-anchor="middle">writes the change</text>

  <rect x="540" y="230" width="230" height="40" rx="10" fill="#121a30" stroke="#1e2a4a"/>
  <text class="sans n" x="655" y="256" text-anchor="middle">reviews its own diff</text>

  <rect x="306" y="338" width="208" height="40" rx="10" fill="#121a30" stroke="#1e2a4a"/>
  <text class="sans n" x="410" y="364" text-anchor="middle">agrees with itself</text>

  <rect x="52" y="230" width="180" height="40" rx="10" fill="#121a30" stroke="#1e2a4a"/>
  <text class="sans n" x="142" y="256" text-anchor="middle">commits</text>

  <text class="sans s" x="410" y="244" text-anchor="middle" fill="#5a6b8c">2 a.m.</text>
  <text class="sans s" x="410" y="268" text-anchor="middle" fill="#5a6b8c">no one in the room</text>

  <text class="sans s" x="40" y="416">Nothing in this loop can say no. Every arrow is the same model.</text>

  <line x1="40" y1="444" x2="780" y2="444" stroke="#1e2a4a" stroke-width="1.5"/>

  <!-- panel 2 -->
  <text class="sans cap" x="40" y="486">WITH THE GATE</text>
  <text class="sans h" x="40" y="522">One step it does not get to decide</text>

  <circle cx="410" cy="640" r="96" fill="none" stroke="#1e2a4a" stroke-width="2"/>
  <path d="M410 544 A96 96 0 0 1 506 640" fill="none" stroke="#22c55e" stroke-width="2.5" class="f" opacity=".5"/>

  <rect x="298" y="524" width="224" height="40" rx="10" fill="#121a30" stroke="#1e2a4a"/>
  <text class="sans n" x="410" y="550" text-anchor="middle">writes the change</text>

  <rect x="528" y="620" width="240" height="40" rx="10" fill="#121a30" stroke="#1e2a4a"/>
  <text class="sans n" x="648" y="646" text-anchor="middle">reviews and verdicts</text>

  <rect x="318" y="716" width="184" height="40" rx="10" fill="#121a30" stroke="#1e2a4a"/>
  <text class="sans n" x="410" y="742" text-anchor="middle">tries to write</text>

  <rect x="52" y="620" width="180" height="40" rx="10" fill="#121a30" stroke="#1e2a4a"/>
  <text class="sans n" x="142" y="646" text-anchor="middle">commits</text>

  <!-- the gate sits on the arc between the attempt and the commit -->
  <rect x="300" y="616" width="18" height="52" rx="5" fill="#f43f5e" class="hd"/>
  <g class="st">
    <rect x="98" y="676" width="196" height="56" rx="11" fill="#f43f5e" fill-opacity=".12" stroke="#f43f5e" stroke-width="1.6"/>
    <text class="mono" x="112" y="700" font-size="15" font-weight="700" fill="#f43f5e">PreToolUse: deny</text>
    <text class="sans" x="112" y="722" font-size="15" fill="#93a4c8">BLOCK stands. Fix it.</text>
  </g>
</svg>
