#
# Build the site from posts/<collection>/*.md and publish it to GitHub Pages.
# The source of truth stays markdown; build.py renders it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "assets/**"
      - "web/**"
      - "build.py"
      - "gen_covers.py"
      - "requirements.txt"
      - ".github/workflows/pages.yaml"
  # The footer year is rendered at build time, so a site that is not rebuilt
  # keeps last year's copyright until someone publishes something. Rebuild
  # monthly so the turn of the year fixes itself.
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a half-finished deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the builder
        run: python3 -m pip install -r requirements.txt
      - name: Generate cover art
        # Regenerated every build so a new post always has a cover, and so a
        # malformed SVG fails here rather than half-rendering in a browser.
        run: python3 gen_covers.py
      - name: Build the site
        # Fails on a missing front-matter field, a duplicate slug, an
        # unresolvable cover or a broken internal link - none of which are
        # visible once deployed.
        run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to Pages
      id-token: write # OIDC verification of the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
