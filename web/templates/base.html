{{extra_head}}
<script>
  // Dark is the default for everyone regardless of OS preference - this is a
  // dark-first design. A visitor who picks light with the toggle keeps it.
  // Applied before first paint so there is no flash of the wrong theme.
  (() => {
    let t;
    try { t = localStorage.getItem("theme"); } catch { t = null; }
    document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
  })();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="progress" aria-hidden="true"></div>

<header class="hdr">

       this section. "Writing" in the nav is this site. -->
  <a class="hdr__brand" href="https://sandeepbazar.github.io/">
    <svg class="hdr__mark" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6f6cf6"/><stop offset="1" stop-color="#38bdf8"/>
      </linearGradient></defs>
      <rect x="3.5" y="3.5" width="25" height="25" rx="7.5" fill="url(#hg)" opacity=".2"/>
      <rect x="3.5" y="3.5" width="25" height="25" rx="7.5" fill="none" stroke="url(#hg)" stroke-width="1.8"/>
      <path d="M11 20.5c4.2 0 6-2 6-4.2 0-3.6-5.6-2.6-5.6-5.6 0-1.6 1.5-2.6 3.4-2.6 1.5 0 2.7.5 3.5 1.2" fill="none" stroke="#38bdf8" stroke-width="2.1" stroke-linecap="round"/>
    </svg>
    Sandeep Bazar

  <nav class="hdr__nav">

  <div class="hdr__spacer"></div>
  <button class="iconbtn" id="theme" type="button" aria-label="Toggle colour theme">

    </svg>

      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8"/>
    </svg>
  </button>
