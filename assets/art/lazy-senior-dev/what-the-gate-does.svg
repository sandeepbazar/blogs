<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" role="img" aria-label="A sequence: the agent asks to edit a file, the PreToolUse hook reads the verdict it last printed, finds BLOCK and denies the write naming the line and the reason, the file stays unchanged, the agent fixes the finding and prints an approving verdict, and the retried write is allowed through.">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .cap{font-size:15px;font-weight:700;letter-spacing:.15em;fill:#5a6b8c}
    .st{font-size:18px;fill:#e8ecf8}
    .sm{font-size:16px;fill:#93a4c8}
    .tag{font-size:15px;font-weight:700}
    @keyframes reveal{0%,8%{opacity:0;transform:translateY(6px)}16%,100%{opacity:1;transform:translateY(0)}}
    .r1{animation:reveal 12s ease-out infinite;animation-delay:0s}
    .r2{animation:reveal 12s ease-out infinite;animation-delay:-10.4s}
    .r3{animation:reveal 12s ease-out infinite;animation-delay:-8.8s}
    .r4{animation:reveal 12s ease-out infinite;animation-delay:-7.2s}
    .r5{animation:reveal 12s ease-out infinite;animation-delay:-5.6s}
    @media (prefers-reduced-motion:reduce){
      .r1,.r2,.r3,.r4,.r5{animation:none;opacity:1;transform:none}
    }
  </style>
  <rect width="820" height="600" fill="#0b1020"/>
  <text class="sans cap" x="40" y="42">WHAT THE HOOK ACTUALLY DOES</text>

  <!-- 1 -->
  <g class="r1">
    <circle cx="56" cy="94" r="15" fill="#8ea2ff" fill-opacity=".18"/>
    <text class="sans" x="56" y="100" font-size="15" font-weight="700" fill="#8ea2ff" text-anchor="middle">1</text>
    <rect x="86" y="74" width="694" height="46" rx="10" fill="#121a30" stroke="#1e2a4a"/>
    <text class="mono st" x="104" y="103">Edit app.py</text>
    <text class="sans sm" x="270" y="103">the agent asks to write; the hook runs first</text>
  </g>

  <!-- 2 -->
  <g class="r2">
    <circle cx="56" cy="172" r="15" fill="#f43f5e" fill-opacity=".18"/>
    <text class="sans" x="56" y="178" font-size="15" font-weight="700" fill="#f43f5e" text-anchor="middle">2</text>
    <rect x="86" y="148" width="694" height="74" rx="10" fill="#121a30" stroke="#1e2a4a"/>
    <text class="sans sm" x="104" y="176">it reads the verdict the agent last printed</text>
    <text class="mono tag" x="104" y="204" fill="#f43f5e">GRUMP: BLOCK — 1 finding open</text>
  </g>

  <!-- 3 -->
  <g class="r3">
    <circle cx="56" cy="278" r="15" fill="#f43f5e" fill-opacity=".18"/>
    <text class="sans" x="56" y="284" font-size="15" font-weight="700" fill="#f43f5e" text-anchor="middle">3</text>
    <rect x="86" y="248" width="694" height="88" rx="10" fill="#f43f5e" fill-opacity=".10" stroke="#f43f5e" stroke-width="1.6"/>
    <text class="mono tag" x="104" y="278" fill="#f43f5e">permissionDecision: "deny"</text>
    <text class="sans sm" x="104" y="304">app.py:11 — the key is compared with ==, which leaks its</text>
    <text class="sans sm" x="104" y="326">length and prefix through timing</text>
  </g>

  <!-- 4 -->
  <g class="r4">
    <circle cx="56" cy="390" r="15" fill="#22c55e" fill-opacity=".18"/>
    <text class="sans" x="56" y="396" font-size="15" font-weight="700" fill="#22c55e" text-anchor="middle">4</text>
    <rect x="86" y="362" width="694" height="74" rx="10" fill="#121a30" stroke="#22c55e" stroke-width="1.3"/>
    <text class="mono st" x="104" y="392">hmac.compare_digest(provided, API_KEY)</text>
    <text class="mono tag" x="104" y="418" fill="#22c55e">GRUMP: APPROVE — Fine.</text>
  </g>

  <!-- 5 -->
  <g class="r5">
    <circle cx="56" cy="484" r="15" fill="#22c55e" fill-opacity=".18"/>
    <text class="sans" x="56" y="490" font-size="15" font-weight="700" fill="#22c55e" text-anchor="middle">5</text>
    <rect x="86" y="462" width="694" height="46" rx="10" fill="#121a30" stroke="#1e2a4a"/>
    <text class="sans st" x="104" y="491">the retried write is allowed, and lands</text>
    <circle cx="742" cy="485" r="16" fill="#22c55e" fill-opacity=".18"/>
    <path d="M734 485 l6 7 l12 -14" stroke="#22c55e" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text class="sans sm" x="40" y="556" fill="#5a6b8c">A BLOCK is never downgraded by mode. With no verdict at all,</text>
  <text class="sans sm" x="40" y="578" fill="#5a6b8c">the write is refused until one is printed.</text>
</svg>
