<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%">
      <stop offset="0" stop-color="#34d399" stop-opacity=".55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
  </defs>
  <style>
    .drift { animation: drift 14s ease-in-out infinite alternate; }
    .drift2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
    .spin { animation: spin 44s linear infinite; transform-origin: 600.0px 315.0px; }
    .spin-slow { animation: spin 72s linear infinite reverse; transform-origin: 600.0px 315.0px; }
    .pulse { animation: pulse 3.6s ease-in-out infinite; }
    @keyframes drift { from { transform: translate(-26px,-16px); } to { transform: translate(26px,18px); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) {
      .drift, .drift2, .spin, .spin-slow, .pulse { animation: none; }
    }
  </style>
  <rect width="1200" height="630" fill="#070b16"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridmask)"/>
  <ellipse class="drift" cx="316" cy="271" rx="340" ry="250" fill="url(#glow1)"/>
  <ellipse class="drift2" cx="860" cy="396" rx="320" ry="240" fill="url(#glow2)"/>
  <g class="pulse" style="animation-delay:0.0s;animation-duration:4.3s"><path d="M600.0 336.0 L900.0 375.0 L600.0 414.0 L300.0 375.0 Z" fill="url(#g1)" opacity="0.16"/><path d="M600.0 336.0 L900.0 375.0 L600.0 414.0 L300.0 375.0 Z" fill="none" stroke="#6ee7b7" stroke-opacity=".45" stroke-width="1.6"/></g>
  <g class="pulse" style="animation-delay:0.5s;animation-duration:4.8s"><path d="M600.0 262.0 L892.0 301.0 L600.0 340.0 L308.0 301.0 Z" fill="url(#g1)" opacity="0.29"/><path d="M600.0 262.0 L892.0 301.0 L600.0 340.0 L308.0 301.0 Z" fill="none" stroke="#6ee7b7" stroke-opacity=".45" stroke-width="1.6"/></g>
  <g class="pulse" style="animation-delay:1.0s;animation-duration:4.5s"><path d="M600.0 188.0 L884.0 227.0 L600.0 266.0 L316.0 227.0 Z" fill="url(#g1)" opacity="0.42"/><path d="M600.0 188.0 L884.0 227.0 L600.0 266.0 L316.0 227.0 Z" fill="none" stroke="#6ee7b7" stroke-opacity=".45" stroke-width="1.6"/></g>
  <g class="pulse" style="animation-delay:1.5s;animation-duration:5.5s"><path d="M600.0 114.0 L876.0 153.0 L600.0 192.0 L324.0 153.0 Z" fill="url(#g1)" opacity="0.55"/><path d="M600.0 114.0 L876.0 153.0 L600.0 192.0 L324.0 153.0 Z" fill="none" stroke="#6ee7b7" stroke-opacity=".45" stroke-width="1.6"/></g>
  <circle class="pulse" cx="741" cy="435" r="4.3" fill="#38bdf8" style="animation-delay:1.1s"/>
  <circle class="pulse" cx="288" cy="457" r="3.5" fill="#38bdf8" style="animation-delay:2.6s"/>
  <circle class="pulse" cx="126" cy="301" r="3.9" fill="#38bdf8" style="animation-delay:2.7s"/>
  <circle class="pulse" cx="932" cy="530" r="3.0" fill="#38bdf8" style="animation-delay:0.7s"/>
  <circle class="pulse" cx="237" cy="99" r="2.9" fill="#38bdf8" style="animation-delay:0.5s"/>
  <rect x="56" y="526" width="152" height="46" rx="23"
        fill="#070b16" fill-opacity=".55" stroke="#6ee7b7" stroke-opacity=".45"/>
  <text x="70" y="557" fill="#6ee7b7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="19" letter-spacing="1.2">IBM Fusion</text>
  <text x="1144" y="557" fill="#7f8db5" text-anchor="end"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">sandeepbazar</text>
  <title>IBM Fusion — cover art</title>
</svg>
