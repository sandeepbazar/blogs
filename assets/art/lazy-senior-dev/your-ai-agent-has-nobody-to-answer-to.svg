<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="An agent's write travels toward the branch and is stopped by a gate. Three reviewers stand at it: the Grump who blocks the merge, the Paranoid SRE who asks how it fails, and Tenured who remembers the postmortem. Beneath, defects reaching the branch fall from 29% unaided to 0% with the gate.">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .cap{font-size:13px;font-weight:700;letter-spacing:.18em;fill:#5a6b8c}
    .ttl{font-size:34px;font-weight:800;fill:#e8ecf8}
    .sub{font-size:16px;fill:#93a4c8}
    .nm{font-size:17px;font-weight:700;fill:#e8ecf8}
    .rl{font-size:13.5px;fill:#93a4c8}
    .vd{font-size:12px;font-weight:700;letter-spacing:.08em}
    .num{font-size:52px;font-weight:800}
    .lbl{font-size:13px;fill:#93a4c8}

    /* the write travels, is refused, is fixed, and passes */
    @keyframes travel{0%{transform:translateX(0);opacity:0}4%{opacity:1}26%{transform:translateX(206px);opacity:1}34%{transform:translateX(206px);opacity:1}40%{opacity:0}100%{opacity:0}}
    @keyframes shove{0%,26%{transform:translateX(206px)}30%{transform:translateX(178px)}34%{transform:translateX(192px)}40%,100%{opacity:0}}
    @keyframes denied{0%,25%{opacity:0;transform:scale(.85)}31%{opacity:1;transform:scale(1.08)}37%,52%{opacity:1;transform:scale(1)}60%,100%{opacity:0}}
    @keyframes barred{0%,24%{opacity:.30}32%{opacity:1}52%{opacity:1}62%,100%{opacity:.30}}
    @keyframes pass{0%,60%{opacity:0;transform:translateX(206px)}68%{opacity:1}88%{opacity:1;transform:translateX(470px)}96%,100%{opacity:0;transform:translateX(470px)}}
    @keyframes landed{0%,86%{opacity:0;transform:scale(.9)}93%{opacity:1;transform:scale(1.05)}97%,100%{opacity:1;transform:scale(1)}}
    @keyframes wake{0%,20%{opacity:.45}28%,56%{opacity:1}66%,100%{opacity:.45}}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes rise{0%,66%{opacity:0;transform:translateY(8px)}76%,100%{opacity:1;transform:translateY(0)}}

    .w{animation:travel 10s ease-in-out infinite}
    .w2{animation:shove 10s ease-in-out infinite}
    .dn{animation:denied 10s ease-out infinite;transform-origin:420px 150px}
    .bar{animation:barred 10s ease-in-out infinite}
    .ps{animation:pass 10s ease-in-out infinite}
    .ld{animation:landed 10s ease-out infinite;transform-origin:1010px 150px}
    .wk{animation:wake 10s ease-in-out infinite}
    .fl{stroke-dasharray:7 9;animation:flow 1.5s linear infinite}
    .rz{animation:rise 10s ease-out infinite}
    @media (prefers-reduced-motion:reduce){
      .w,.w2,.dn,.bar,.ps,.ld,.wk,.fl,.rz{animation:none}
      .w,.ps{opacity:0}
      .dn,.ld,.bar,.wk,.rz{opacity:1}
    }
  </style>

  <rect width="1200" height="630" fill="#0b1020"/>
  <rect x="0" y="0" width="1200" height="4" fill="#8ea2ff" opacity=".6"/>

  <text class="sans ttl" x="60" y="70">Your AI agent has nobody to answer to.</text>
  <text class="sans sub" x="60" y="100">It writes the code, reviews its own diff, agrees with itself, and commits. At 2 a.m. With no one in the room.</text>

  <!-- the lane: agent -> gate -> branch -->
  <text class="sans cap" x="60" y="140">AGENT</text>
  <text class="sans cap" x="392" y="140">THE GATE</text>
  <text class="sans cap" x="962" y="140">BRANCH</text>

  <line x1="60" y1="192" x2="1140" y2="192" stroke="#1e2a4a" stroke-width="2"/>
  <line x1="150" y1="192" x2="400" y2="192" stroke="#8ea2ff" stroke-width="2" fill="none" class="fl" opacity=".6"/>
  <line x1="452" y1="192" x2="1050" y2="192" stroke="#22c55e" stroke-width="2" fill="none" class="fl" opacity=".35"/>

  <!-- the gate post -->
  <rect x="414" y="150" width="26" height="86" rx="6" fill="#f43f5e" class="bar"/>
  <rect x="414" y="150" width="26" height="86" rx="6" fill="none" stroke="#f43f5e" stroke-width="2" opacity=".5"/>

  <!-- the write in flight, shoved back -->
  <g class="w">
    <g class="w2">
      <rect x="150" y="172" width="150" height="40" rx="9" fill="#121a30" stroke="#8ea2ff" stroke-width="1.5"/>
      <text class="mono" x="166" y="197" font-size="14" fill="#e8ecf8">Edit app.py</text>
    </g>
  </g>

  <!-- refused -->
  <g class="dn">
    <rect x="470" y="164" width="196" height="56" rx="10" fill="#f43f5e" fill-opacity=".12" stroke="#f43f5e" stroke-width="1.5"/>
    <text class="sans vd" x="486" y="188" fill="#f43f5e">DENIED · BLOCK STANDS</text>
    <text class="sans" x="486" y="208" font-size="12.5" fill="#93a4c8">fix it, then print a verdict</text>
  </g>

  <!-- the fixed write passing -->
  <g class="ps">
    <rect x="150" y="172" width="188" height="40" rx="9" fill="#121a30" stroke="#22c55e" stroke-width="1.5"/>
    <text class="mono" x="166" y="197" font-size="14" fill="#e8ecf8">compare_digest()</text>
  </g>
  <g class="ld">
    <circle cx="1010" cy="192" r="17" fill="#22c55e" fill-opacity=".18"/>
    <path d="M1002 192 l6 7 l12 -15" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the three who stand at it -->
  <g class="wk">
    <rect x="60" y="268" width="352" height="126" rx="13" fill="#121a30" stroke="#1e2a4a"/>
    <circle cx="92" cy="300" r="11" fill="#8ea2ff" fill-opacity=".2"/>
    <text class="sans nm" x="114" y="305">The Grump</text>
    <text class="sans rl" x="80" y="332">Staff engineer. Reads the diff.</text>
    <text class="sans rl" x="80" y="352">Names the line, the failure, the smallest fix.</text>
    <text class="mono vd" x="80" y="378" fill="#93a4c8">APPROVE · REQUEST_CHANGES · <tspan fill="#f43f5e">BLOCK</tspan></text>

    <rect x="424" y="268" width="352" height="126" rx="13" fill="#121a30" stroke="#1e2a4a"/>
    <circle cx="456" cy="300" r="11" fill="#38bdf8" fill-opacity=".2"/>
    <text class="sans nm" x="478" y="305">The Paranoid SRE</text>
    <text class="sans rl" x="444" y="332">On-call. Reads the deploy, not the code.</text>
    <text class="sans rl" x="444" y="352">Limits, probes, rollouts, rollbacks, alerts.</text>
    <text class="mono vd" x="444" y="378" fill="#93a4c8">SHIP · HOLD · <tspan fill="#f43f5e">PAGE</tspan></text>

    <rect x="788" y="268" width="352" height="126" rx="13" fill="#121a30" stroke="#1e2a4a"/>
    <circle cx="820" cy="300" r="11" fill="#f472b6" fill-opacity=".2"/>
    <text class="sans nm" x="842" y="305">Tenured</text>
    <text class="sans rl" x="808" y="332">Was there. Reads the log and the postmortem.</text>
    <text class="sans rl" x="808" y="352">Has this repository already tried this?</text>
    <text class="mono vd" x="808" y="378" fill="#93a4c8">NEW · SEEN_BEFORE · <tspan fill="#f43f5e">DO_NOT_REPEAT</tspan></text>
  </g>

  <!-- the measured result -->
  <g class="rz">
    <rect x="60" y="424" width="1080" height="128" rx="14" fill="#121a30" stroke="#1e2a4a"/>
    <text class="sans cap" x="84" y="454">DEFECTS REACHING THE BRANCH — AGENT WROTE THE CODE, 90 RUNS PER ARM</text>

    <text class="sans num" x="140" y="516" fill="#f43f5e" text-anchor="middle">29%</text>
    <text class="sans lbl" x="140" y="538" text-anchor="middle">no skill</text>

    <text class="sans num" x="360" y="516" fill="#93a4c8" text-anchor="middle">8%</text>
    <text class="sans lbl" x="360" y="538" text-anchor="middle">careful prompt</text>

    <text class="sans num" x="580" y="516" fill="#93a4c8" text-anchor="middle">6%</text>
    <text class="sans lbl" x="580" y="538" text-anchor="middle">ruleset loaded</text>

    <text class="sans num" x="800" y="516" fill="#22c55e" text-anchor="middle">0%</text>
    <text class="sans lbl" x="800" y="538" text-anchor="middle">ruleset + gate</text>

    <line x1="920" y1="452" x2="920" y2="528" stroke="#1e2a4a" stroke-width="1.5"/>
    <text class="sans" x="944" y="480" font-size="14" font-weight="700" fill="#e8ecf8">Most of it is the prompt.</text>
    <text class="sans" x="944" y="502" font-size="13" fill="#93a4c8">The last step is the refusal —</text>
    <text class="sans" x="944" y="521" font-size="13" fill="#93a4c8">the part a prompt cannot do.</text>
  </g>

  <text class="sans" x="60" y="586" font-size="12.5" fill="#5a6b8c">Antigravity CLI, gemini-3.6-flash-medium. IBM Bob Shell: 18% to 0%. Codex CLI: 18% to 6%. Claude Code: 7% to 2%.</text>
  <text class="sans" x="1140" y="586" font-size="12.5" fill="#5a6b8c" text-anchor="end">lazy-senior-dev</text>
</svg>
