<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ea2ff"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glowV" cx="50%" cy="50%">
      <stop offset="0" stop-color="#6f6cf6" stop-opacity=".5"/><stop offset="1" stop-color="#6f6cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".38"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
  </defs>
  <style>
    /* Only the background moves. A card is rasterised by every social preview
       at an unpredictable moment, so the data is drawn, never played in. */
    .drift { animation: drift 16s ease-in-out infinite alternate; }
    .drift2 { animation: drift 21s ease-in-out infinite alternate-reverse; }
    .wall { animation: pulse 4.5s ease-in-out infinite; }
    @keyframes drift { from { transform: translate(-24px,-14px); } to { transform: translate(24px,16px); } }
    @keyframes pulse { 0%,100% { opacity: .8 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .drift, .drift2, .wall { animation: none; } }
  </style>
  <rect width="1200" height="630" fill="#070b16"/>
  <ellipse class="drift" cx="230" cy="150" rx="420" ry="300" fill="url(#glowV)"/>
  <ellipse class="drift2" cx="1010" cy="520" rx="380" ry="280" fill="url(#glowC)"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridmask)"/>

  <text x="64" y="80" fill="#7f8db5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" letter-spacing="2.6">ONE BUILD · ONE FLEET · 22 SCRIPTED INCIDENTS</text>
  <text x="64" y="152" fill="#eef2ff" font-family="Inter,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,sans-serif" font-size="58" font-weight="700">Three agents.</text>
